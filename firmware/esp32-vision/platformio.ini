[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; upload_port = COM4  ; Windows - comment out for Rock64 Linux
; For Rock64 Linux, remove the upload_port line or use: /dev/ttyUSB0
upload_speed = 115200
lib_deps = 
  esp32-camera
